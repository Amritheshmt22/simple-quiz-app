<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Simple Quiz App</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="app-shell">
    <section class="hero" aria-labelledby="page-title">
      <p class="eyebrow">Frontend practice project</p>
      <h1 id="page-title">Simple Quiz App</h1>
      <p class="intro">Answer five web development questions, get instant feedback and save your best score in this browser.</p>
    </section>

    <section class="quiz-card" aria-label="Quiz">
      <div class="quiz-topline">
        <span id="questionCount">Question 1 of 5</span>
        <span id="scoreText">Score: 0</span>
      </div>

      <div class="progress-track" aria-label="Quiz progress">
        <div id="progressBar" class="progress-bar"></div>
      </div>

      <div id="questionPanel">
        <h2 id="questionText">Loading question...</h2>
        <div id="answersList" class="answers-list" role="group" aria-label="Answer choices"></div>
        <p id="feedbackText" class="feedback-text" aria-live="polite">Choose an answer.</p>
        <button id="nextButton" class="primary-button" type="button" disabled>Next question</button>
      </div>

      <div id="resultPanel" class="result-panel" hidden>
        <span class="result-label">Final score</span>
        <strong id="finalScore">0/5</strong>
        <p id="resultMessage">Your result will appear here.</p>
        <p id="bestScoreText">Best score: 0/5</p>
        <button id="restartButton" class="primary-button" type="button">Restart quiz</button>
      </div>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
